# GitHub Actions 工作流 - 构建 Android APK
#
# 使用方法:
# 1. 将此仓库推送到 GitHub
# 2. 进入 Actions 标签页
# 3. 点击 "Build Android App" 工作流
# 4. 点击 "Run workflow" 按钮触发构建
# 5. 等待构建完成(约15-30分钟),在 Artifacts 中下载 APK

name: Build Android App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev python3-pip \
            libssl-dev libffi-dev zlib1g-dev pkg-config wget unzip \
            fonts-liberation libgl1-mesa-glx

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install buildozer cython==3.0.10

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          SDKMGR=$(find / -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMGR" ]; then
            echo "Found sdkmanager at: $SDKMGR"
            echo y | "$SDKMGR" --licenses
          else
            echo "sdkmanager not found yet, will try during buildozer run"
          fi

      - name: Install app requirements
        run: |
          pip install -r requirements.txt || echo "No requirements.txt found, continuing..."

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 60

      - name: List build artifacts
        if: always()
        run: |
          echo "=== dist directory ==="
          ls -la dist/ 2>/dev/null || echo "dist directory not found"
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: stock-display-app
          path: dist/*.apk
          retention-days: 30
