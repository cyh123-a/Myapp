name: Build Android App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev python3-pip \
            libssl-dev libffi-dev zlib1g-dev pkg-config wget unzip \
            fonts-liberation libgl1-mesa-glx

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install buildozer cython==3.0.10

      - name: Install app requirements
        run: |
          pip install -r requirements.txt || echo "No requirements.txt found, continuing..."

      - name: Build APK (first pass - download SDK/NDK)
        run: |
          buildozer android debug 2>&1 | tee buildozer-first.log || true
        timeout-minutes: 45

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          # 尝试直接路径接受许可证
          if [ -f $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager ]; then
            echo y | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses
            echo "Licenses accepted via direct path"
          else
            echo "Direct path not found, searching..."
            # 搜索sdkmanager并接受许可证
            find $HOME/.buildozer -name sdkmanager -type f -print -quit | while read -r SDKMGR; do
              echo y | $SDKMGR --licenses && echo "Licenses accepted via search" && break
            done || echo "Could not find sdkmanager"
          fi

      - name: Build APK (second pass - compile)
        run: |
          buildozer android debug
        timeout-minutes: 45

      - name: List build artifacts
        if: always()
        run: |
          echo "=== dist directory ==="
          ls -la dist/ 2>/dev/null || echo "dist directory not found"
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "=== buildozer cache ==="
          ls -la .buildozer/ 2>/dev/null || echo ".buildozer directory not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: stock-display-app
          path: dist/*.apk
          retention-days: 30

      - name: Upload Build Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: buildozer-logs
          path: |
            buildozer-first.log
            .buildozer/
          retention-days: 7
