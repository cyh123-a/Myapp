name: Build Android App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev python3-pip libssl-dev libffi-dev zlib1g-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: Install buildozer
        run: |
          pip install buildozer
          pip install cython==0.29.36

      - name: Install app requirements
        run: |
          pip install -r requirements.txt

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          yes | sdkmanager --licenses

      - name: Build APK with verbose log
        run: |
          buildozer -v android debug > buildozer.log 2>&1 || true
        timeout-minutes: 45

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildozer-log
          path: buildozer.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-display-app
          path: dist/*.apk
          retention-days: 30
