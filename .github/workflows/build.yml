# GitHub Actions 工作流 - 构建 Android APK
#
# 使用方法:
# 1. 将此仓库推送到 GitHub
# 2. 进入 Actions 标签页
# 3. 点击 "Build Android App" 工作流
# 4. 点击 "Run workflow" 按钮触发构建
# 5. 等待构建完成（约 15-30 分钟），在 Artifacts 中下载 APK

name: Build Android App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev python3-pip \
            libssl-dev libffi-dev zlib1g-dev pkg-config wget unzip fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel buildozer cython==3.0.10
          # 将 pip 用户 bin 目录加入 PATH（GitHub Actions 特殊变量）
          echo "/root/.local/bin" >> 

      - name: Verify buildozer installation
        run: |
          echo "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          which buildozer && buildozer --version || echo "ERROR: buildozer not found in PATH"
          # 如果 buildozer 命令不可用，尝试手动查找
          if ! which buildozer >/dev/null 2>&1; then
            echo "Searching for buildozer script..."
            find /opt/hostedtoolcache/Python -name "buildozer" -type f 2>/dev/null | head -5
            find /root/.local/bin -name "buildozer" -type f 2>/dev/null | head -5
          fi

      - name: Install app requirements
        run: |
          pip install -r requirements.txt

      - name: Build APK (first attempt - downloads SDK)
        run: |
          # 第一次运行会下载 SDK/NDK，可能会在许可证环节暂停
          # 使用 || true 确保即使失败也不会停止工作流
          buildozer android debug 2>&1 || true
        timeout-minutes: 45

      - name: Accept Android SDK licenses
        run: |
          # SDK 应该已经被下载了，找到 sdkmanager 并自动接受所有许可证
          SDKMANAGER=
          if [ -n "" ]; then
            echo "Found sdkmanager at: "
            echo y | "" --licenses
          else
            echo "sdkmanager not found in ~/.buildozer, searching..."
            SDKMANAGER=
            if [ -n "" ]; then
              echo "Found sdkmanager at: "
              echo y | "" --licenses
            else
              echo "WARNING: sdkmanager not found anywhere"
              ls -la ~/.buildozer/android/platform/ 2>/dev/null || echo "No android platform directory"
            fi
          fi

      - name: Build APK (second attempt - with licenses accepted)
        run: |
          # 许可证已接受，这次应该能顺利编译
          buildozer android debug
        timeout-minutes: 45

      - name: List build artifacts
        if: always()
        run: |
          echo "=== dist directory ==="
          ls -la dist/ 2>/dev/null || echo "dist directory not found"
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "=== buildozer cache ==="
          ls -la .buildozer/ 2>/dev/null || echo ".buildozer directory not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: stock-display-app
          path: dist/*.apk
          retention-days: 30

      - name: Upload Build Log on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: buildozer-logs
          path: .buildozer/
          retention-days: 7
